# TRISHUL — LOCAL edition configuration.
#
# This file is the complete configuration for a LOCAL deployment: the AI runs
# on a model server on this machine, and no cloud API key is required.
#
# Point the application at it with:
#
#     export TRISHUL_CONFIG=config/default.local.yaml
#
# The release archive TRISHUL-LOCAL.zip ships this file as config/default.yaml,
# so it is used automatically without any environment variable.

app:
  name: TRISHUL
  version: "2.0.0"
  db_path: data/trishul.db
  reports_dir: reports
  plugins_dir: plugins
  log_level: INFO
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

scan:
  default_mode: deep
  timeout_seconds: 900
  thread_limit: 8
  max_concurrent_scans: 3
  ffuf_max_requests: 2000
  ffuf_status_filter:
    - 200
    - 204
    - 301
    - 302
    - 307
    - 401
    - 403
  wordlist: config/wordlists/common.txt
  param_wordlist: config/wordlists/params.txt

tools:
  httpx: httpx
  nuclei: nuclei
  ffuf: ffuf
  nmap: nmap
  ffuf_wordlist: config/wordlists/common.txt
  param_wordlist: config/wordlists/params.txt
  allowed_binaries:
    - httpx
    - nuclei
    - ffuf
    - nmap
    - git
    - go

# The LOCAL edition: a model server on this machine. No cloud key is needed.
ai:
  edition: local
  provider: ollama
  model: llama3.1:8b
  base_url: http://localhost:11434
  timeout_seconds: 120
  max_tokens: 2048
  temperature: 0.2
  fail_open: true

auth:
  enabled: true
  username: admin
  password: ""
  token_ttl_seconds: 86400

security:
  allow_private_targets: false
  authorized_targets: []
  rate_limit_requests: 120
  rate_limit_window_seconds: 60
  login_rate_limit_attempts: 10
  login_rate_limit_window_seconds: 60
  blocked_hostnames:
    - 169.254.169.254
    - metadata.google.internal
    - metadata.goog

integrations:
  cache_ttl_seconds: 3600
  rate_limit_per_minute: 30
  timeout_seconds: 20
  max_response_bytes: 512000
